name: Release

# Branch push: replace the rolling prerelease named "latest".
# Tag push: publish a release whose version is the tag name, with no format check.
on:
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref_type == 'tag' && format('release-{0}', github.ref) || 'preview-latest' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - os: windows-latest
            targets: |
              x86_64-pc-windows-msvc guid-windows-x86_64
              aarch64-pc-windows-msvc guid-windows-aarch64
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      - name: Build
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          set -euo pipefail
          mkdir -p upload stage

          # Static CRT flags come from .cargo/config.toml. Do not set RUSTFLAGS here;
          # an environment RUSTFLAGS replaces those flags instead of appending to them.
          cargo test --locked --target x86_64-pc-windows-msvc

          # <runtime>.zip contains <runtime>/guid.exe (Windows) or <runtime>/guid.
          # The binary keeps the name produced by the build so it can sit on PATH.
          while read -r target runtime; do
            if [ -z "${target:-}" ]; then
              continue
            fi
            echo "Building ${target} -> ${runtime}.zip"
            cargo build --locked --release --target "$target" || exit 1
            if [[ "$target" == *-windows-* ]]; then
              src="target/${target}/release/guid.exe"
              bin="guid.exe"
            else
              src="target/${target}/release/guid"
              bin="guid"
            fi
            mkdir -p "stage/${runtime}"
            cp "$src" "stage/${runtime}/${bin}" || exit 1
            if [[ "$bin" != *.exe ]]; then
              chmod +x "stage/${runtime}/${bin}"
            fi

            archive="upload/${runtime}.zip"
            rm -f "$archive"
            if command -v zip >/dev/null 2>&1; then
              (cd stage && zip -r -X "../${archive}" "$runtime")
            else
              tar.exe -a -c -f "$archive" -C stage "$runtime"
            fi
          done <<< "$TARGETS"

          host="$(uname -s)-$(uname -m)"
          case "$host" in
            Linux-x86_64) smoke="stage/guid-linux-x86_64/guid" ;;
            Linux-aarch64 | Linux-arm64) smoke="stage/guid-linux-aarch64/guid" ;;
            Darwin-arm64) smoke="stage/guid-macos-aarch64/guid" ;;
            Darwin-x86_64) smoke="stage/guid-macos-x86_64/guid" ;;
            MINGW*-x86_64 | MSYS*-x86_64 | CYGWIN*-x86_64) smoke="stage/guid-windows-x86_64/guid.exe" ;;
            *) smoke="" ;;
          esac

          if [ -n "$smoke" ]; then
            out="$("$smoke")"
            printf 'smoke: %s\n' "$out"
            if [[ ! "$out" =~ ^\{[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\}$ ]]; then
              echo "Smoke test failed: unexpected output" >&2
              exit 1
            fi
          fi

          python .github/check_static_crt.py stage

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}
          path: upload/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          mapfile -t files < <(find dist -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No build artifacts to publish." >&2
            exit 1
          fi

          (
            cd dist
            sha256sum -- *
          ) > SHA256SUMS
          mv SHA256SUMS dist/SHA256SUMS
          files+=(dist/SHA256SUMS)

          notes="$(mktemp)"
          if [ "$REF_TYPE" = "tag" ]; then
            version="$REF_NAME"
            printf 'Release of guid.\n\nVersion: %s\nCommit: %s\n' "$version" "$SHA" > "$notes"
            if gh release view "$version" >/dev/null 2>&1; then
              gh release upload "$version" "${files[@]}" --clobber
              gh release edit "$version" --title "$version" --notes-file "$notes"
            else
              gh release create "$version" "${files[@]}" \
                --target "$SHA" \
                --title "$version" \
                --notes-file "$notes"
            fi
          else
            printf 'Preview build of guid.\n\nVersion: latest\nCommit: %s\nRef: %s\n' "$SHA" "$REF_NAME" > "$notes"
            gh release delete latest --yes --cleanup-tag || true
            gh release create latest "${files[@]}" \
              --target "$SHA" \
              --title latest \
              --notes-file "$notes" \
              --prerelease \
              --latest=false
          fi
